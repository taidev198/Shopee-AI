# Continuous SQLite replication to S3-compatible storage (Cloudflare R2, Backblaze B2, ...).
dbs:
  - path: ${MARKET_DB}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: market-db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        force-path-style: true
        retention: 72h
        sync-interval: 10s
