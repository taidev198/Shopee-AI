services:
  - type: web
    name: marketlens
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: MARKET_DB
        value: /data/market.db
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: BACKUP_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_SECRET_ACCESS_KEY
        sync: false
