services:
  - type: web
    name: marketlens
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: MARKET_DB
        value: /data/market.db
      - key: BACKUP_NEON_URL
        sync: false
      - key: BACKUP_D1_ACCOUNT_ID
        sync: false
      - key: BACKUP_D1_DATABASE_ID
        sync: false
      - key: BACKUP_D1_API_TOKEN
        sync: false
